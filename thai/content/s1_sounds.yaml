- id: s1_08
  title: Долгие и короткие гласные
  intro: |
    Длина гласной в тайском меняет смысл так же, как тон. В транскрипции долгий звук записан двумя буквами: aa, ii, uu.

    Главная пара: ข้าว (khâao) «рис» и เข้า (khâo) «входить». Тон одинаковый, разница только в длине a.

    Тяни долгие гласные дольше, чем кажется нужным: русское ухо их укорачивает.

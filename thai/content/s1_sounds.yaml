- id: s1_04
  title: "Вверх и низко: высокий и низкий тон"
  intro: |
    Высокий тон ↗ и низкий ↘.

    Высокий: голос поднимается и держится высоко, как удивлённое «Ого!». Рука уходит вверх.
    Низкий: ровно, но ниже обычного и тише, как усталое «угу». Ладонь лежит низко, у живота.

    Эталоны: ม้า (máa) «лошадь» для высокого и ใหม่ (mài) «новый» для низкого. Ошибся, жми «🎧 Сравнить»: услышишь слово рядом с эталоном правильного тона и того, который ты выбрал.
  fem: |
    Ошибся, жми => Ошиблась, жми
    который ты выбрал. => который ты выбрала.

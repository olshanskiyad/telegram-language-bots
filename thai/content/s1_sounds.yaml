- id: s1_02
  title: Средний и низкий тон
  intro: |
    Значок над гласной в транскрипции рисует движение голоса: à низко, â сверху вниз, á вверх, ǎ снизу вверх, без значка ровно. Пять тонов разберём по два.

    Начнём с двух самых спокойных тонов.

    Средний (без значка): ровно, на обычной высоте голоса, как гудок телефона.
    Низкий (à): тоже ровно, но ниже обычного и спокойно, как усталое «угу».

    Послушай: слова разных тонов звучат почти одинаково, разница только в высоте.

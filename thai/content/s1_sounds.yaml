- id: s1_03
  title: "Вниз и вверх: два самых непохожих тона"
  intro: |
    С этого урока тоны тренируем по методике, которой учат слух в исследованиях.

    1. Сначала только самые непохожие тоны: нисходящий ⤵ (сверху вниз) и восходящий ⤴ (нырок вниз и вверх, как вопрос).
    2. Слушая и повторяя, веди рукой по мелодии: на ⤵ рука падает сверху вниз, на ⤴ ныряет и уходит вверх, как галочка. Жест реально помогает уху, это проверено.
    3. Перед словом промычи его мелодию на «ммм», потом скажи.
    4. У каждого тона своя эмоция: нисходящий звучит строго, как команда «Нет!», восходящий как переспрос «Да-а?».

    Задания будут двух видов: «тон одинаковый или разный?» и «какой тон?». Голоса в них меняются специально: ухо учится ловить мелодию, а не голос. Кнопка 🎧 в вопросе проигрывает эталоны всех пяти тонов.

- id: s1_06
  title: Все пять тонов
  intro: |
    Классический тайский пример: один слог khaa пятью тонами даёт пять разных слов.

    khaa  застрять (средний)
    khàa  галангал (низкий)
    khâa  цена (нисходящий)
    kháa  торговать (высокий)
    khǎa  нога (восходящий)

    И вторая знаменитая пятёрка, скороговорка «новое дерево ведь не горит?»: ไม้ ใหม่ ไม่ ไหม้ ไหม (máai mài mâi mâi mǎi). «Не» и «горит» звучат одинаково, так и задумано.

    Послушай всё подряд, веди рукой и попробуй повторить.

- id: s1_09
  title: Звуки, которых нет в русском
  intro: |
    Пять звуков, для которых в русском нет буквы. В транскрипции у них свои значки.

    ng: «нг», как в слове «гонг», но в тайском стоит и в начале слова: งู (nguu) «змея». Скажи «гонг», оборви на «нг» и начни с него.
    ʉ: похоже на «ы», только губы растянуты в улыбку: มือ (mʉʉ) «рука».
    ə: нейтральное «э» с расслабленным ртом, как звук, когда задумался: เงิน (ngən) «деньги».
    ɛ: открытое «э», рот шире, как в слове «этот»: แม่ (mɛ̂ɛ) «мама».
    ɔ: открытое «о», ближе к «а», как в английском «law»: หมอ (mɔ̌ɔ) «врач».
  items: |
    งู | змея | mn=Змея спокойно и ровно ползёт: «нгуу» | pic=🐍
    เงิน | деньги | mn=Деньги считают спокойно и ровно | pic=💵
    มือ | рука | mn=Машешь рукой с улыбкой: «мыы», губы растянуты | pic=✋
    ชื่อ | имя | mn=Учитель строго требует: «Имя!»

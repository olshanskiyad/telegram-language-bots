- id: s1_05m
  title: "Средний и низкий: самая трудная пара"
  intro: |
    Самая трудная пара тайского: средний → и низкий ↘. Её путают все, у кого родной язык не тональный, поэтому она отдельно и после остальных.

    Как различать:
    • Низкий ниже и тише, к концу слова чуть проседает, как усталое «угу».
    • Средний ровный до самого конца, как гудок.
    • Слушай конец слова: там разница заметнее всего.
    • Промычи оба на «ммм»: средний держится, низкий оседает.

    С первого раза её не различает почти никто. Тренажёр 🎵 запомнит, что ты путаешь, и будет давать эту пару чаще.

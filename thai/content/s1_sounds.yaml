- id: s1_05
  title: "Средний тон: ровно и спокойно"
  intro: |
    Средний тон → самый спокойный: ровно, на обычной высоте, как гудок телефона. Ладонь просто лежит ровно.

    Проще всего услышать его рядом с «движущимися» тонами. Слог maa тремя тонами:
    มา (maa) ровно: «приходить»
    ม้า (máa) вверх: «лошадь»
    หมา (mǎa) вопросом: «собака»

    Эти три слова и есть эталоны: «приходи, лошадь, собака».

  intro_voice: true
  intro: |
    Послушай: так тайцы здороваются и прощаются. Это первое слово урока.

    Тайский тональный: высота голоса меняет смысл. Пока просто слушай и повторяй вслух вслед за голосом, 🐢 замедляет. Значки над буквами в транскрипции показывают мелодию, их разберём по одному в следующих уроках.


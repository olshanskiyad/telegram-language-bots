# Ступень 1. Звуки и тоны.
# Строка: тайский (слова через ·) | перевод | заметка | mn=подсказка-сценка | pic=эмодзи
# Транскрипцию руками не пишем: сборщик берёт её из Викисловаря.
# Порядок тонов от лёгкого к трудному: пара «средний и низкий» самая трудная, она в конце.
# Код эмоций в подсказках: средний спокойно и ровно, низкий устало и вполголоса,
# нисходящий строго, как команда, высокий удивлённо и высоко, восходящий переспрашивая.
- id: s1_01

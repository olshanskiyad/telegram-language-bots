- id: s1_07
  title: С выдохом и без
  intro: |
    В тайском есть пары согласных, которые русское ухо сливает: k и kh, p и ph, t и th.

    k, p, t: без выдоха, как русские к, п, т.
    kh, ph, th: с лёгким выдохом, как в английских «kit», «pen», «top».

    Проверка ладонью: поднеси её ко рту. На kh чувствуешь струю воздуха, на k нет.

    Две ловушки: th читается как «т» с выдохом (английское «think» тут ни при чём), ph читается как «п» с выдохом (звука «ф» в нём нет).

    ไป·สนามบิน·ครับ | в аэропорт, пожалуйста | mn=«Пай» ехать + «са-наам-бин» аэропорт, откуда улетает Мистер Бин
    จอด·ตรง·นี้·ครับ | остановите здесь | mn=дословно: «джоот» остановить, низко + «тронг-нии» прямо здесь, «нии» высоко
    ใช้·มิเตอร์·ไหม·ครับ | по счётчику поедем? | mn=«Чай» использовать + «ми-тёё» счётчик (таксометр) + «май?» ли, вопросом вверх
    ช้า·ๆ·หน่อย·ครับ | помедленнее, пожалуйста | mn=«Чаа-чаа» (высоко) как танец ча-ча-ча, но медленно + «ной» чуть-чуть, вполголоса
    เร็ว | быстро | mn=Рёв мотора: быстро! | pic=⚡
    รถ·ติด | пробка | mn=Рота машин («рот», высоко) зажата в тисках («тит», низко)
    ถึง·แล้ว | приехали | mn=Ткнулись в ворота: «тхынг» как «тык!» снизу вверх, а «лээо» значит уже
  mission: В такси скажи водителю «остановите здесь» | จอด·ตรง·นี้·ครับ

- id: s2_09
  title: Магазин и 7-Eleven
  split: 5
  intro: |
    На кассе 7-Eleven почти всегда три вопроса: подогреть ли, нужен ли пакет и как платить. Выучи ответы один раз, и касса станет самым простым разговором дня.

    เอา (ao) значит «брать, хотеть»: เอา «беру», ไม่เอา «не надо».

    Спросить, есть ли что-то: มี (mii) «есть» + предмет + ไหม. มีน้ำไหม «вода есть?».
  items: |
    เอา | брать; хочу, надо | mn=Берёшь спокойно: «ао»
    ไม่·เอา·ครับ | не надо, спасибо | mn=«Май» не, строго вниз + «ао» беру, ровно: отодвигаешь рукой «не беру»
    ถุง | пакет | mn=«Пакет?» переспрашивает кассир | pic=🛍️
    ไม่·เอา·ถุง·ครับ | пакет не нужен | mn=дословно: «май ао» не беру + «тхунг» пакет, вопросом вверх, как у кассира
    อุ่น | подогреть; тёплый | mn=Греется тихо внизу микроволновки
    จ่าย | платить | mn=Платишь молча и устало | pic=💸
    เงินสด | наличные | mn=«Нгён» деньги ровно + «сот» как «сотня»: сотенные купюры, низко
    สแกน | оплата по QR-коду | mn=почти как «скан» | pic=📱
    บัตร | карта (банковская) | mn=Короткое «бат!» внизу: приложил карту к терминалу | pic=💳
    จ่าย·บัตร·ได้·ไหม·ครับ | картой можно? | mn=«Джаай» платить + «бат» карта + «даай май?» как «дай мне?»: картой можно?
    มี·น้ำ·ไหม·ครับ | вода есть? | mn=«Мии» есть + «наам» вода, высоко + «май?» ли: «Есть нам воды?»
  dialog: |
    t: สวัสดี·ค่ะ | Здравствуйте!
    me: สวัสดี·ครับ | Здравствуйте
    t: อุ่น·ไหม·คะ | Подогреть?
    me: อุ่น·ครับ | Да, подогрейте
    t: รับ·ถุง·ไหม·คะ | Пакет нужен?
    me: ไม่·เอา·ถุง·ครับ | Не нужен, спасибо
    t: จ่าย·เงินสด·หรือ·สแกน·คะ | Наличными или по QR?

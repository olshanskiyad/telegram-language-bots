# Ступень 2. Первые фразы и простая грамматика.
# Реплики тайцев в диалогах (t:) озвучивает женский голос и они с ค่ะ/คะ, твои (me:) мужской с ครับ.
- id: s2_01
  title: Знакомство
  intro: |
    Тайская грамматика дружелюбная: глаголы не спрягаются, падежей нет, порядок слов почти как в русском. «Я зовут Лео» по-тайски звучит правильно.

    Вопросительное слово стоит в конце: «вы зовут что?». Вежливое ครับ ставь в конце и вопросов, и ответов.

    คุณ (khun) значит и «вы», и «ты»: вежливое обращение к любому.
  fem: |
    «Я зовут Лео» => «Я зовут Анна»
    Вежливое ครับ ставь в конце и вопросов, и ответов. => Вежливое окончание ставь в конце каждой фразы: ค่ะ (khâ) в ответе, คะ (khá) в вопросе.
  items: |
    ผม·ชื่อ·ลีโอ·ครับ | меня зовут Лео | tr=phǒm chʉ̂ʉ lii-oo khráp | ftr=chǎn chʉ̂ʉ an-naa khâ | mn=«Чыы» значит имя, говоришь строго, сверху вниз: за ним называешь своё имя
    คุณ | вы, ты (вежливо) | mn=Как вежливое японское «-кун»: спокойно и ровно
    อะไร | что? | mn=«А рай?» что это? тихо спрашиваешь
    คุณ·ชื่อ·อะไร·ครับ | как вас зовут? | mn=дословно: «кхун» вы + «чыы» имя + «а-рай» что (А рай?)
    ยินดี·ที่·ได้·รู้จัก·ครับ | приятно познакомиться | mn=«Йин-дии» (почти Индия) приятно + «тхии-даай» что удалось + «руу-джак» познакомиться
    สบาย·ดี·ไหม·ครับ | как дела? | mn=«Са-баай» как «баю-бай»: уютно; «дии» ровно, «май?» вопросом вверх
    สบาย·ดี·ครับ | хорошо, всё в порядке | mn=Под «баю-бай» малыш спит: «са-баай-дии», всё хорошо, «дии» ровно
  dialog: |
    t: สวัสดี·ค่ะ | Здравствуйте!
    me: สวัสดี·ครับ | Здравствуйте
    t: คุณ·ชื่อ·อะไร·คะ | Как вас зовут?
    me: ผม·ชื่อ·ลีโอ·ครับ | Меня зовут Лео
    t: ยินดี·ที่·ได้·รู้จัก·ค่ะ | Приятно познакомиться
    me: ยินดี·ที่·ได้·รู้จัก·ครับ | Мне тоже приятно
  mission: Представься кому-нибудь по-тайски | ผม·ชื่อ·ลีโอ·ครับ

- id: s2_02
  title: Вопрос ไหม и отрицание ไม่
  split: 3
  intro: |
    Два слова, на которых держится половина разговоров.

    ไหม (mǎi) в конце превращает фразу в вопрос «да или нет?». ร้อน «жарко», ร้อนไหม «жарко?».
    ไม่ (mâi) перед словом делает отрицание. ร้อน «жарко», ไม่ร้อน «не жарко».

    Отвечают не «да» или «нет», а повтором слова: на «жарко?» говорят «жарко» или «не жарко». Поэтому ได้ (dâai) «можно» и ไม่ได้ «нельзя» слышишь в Таиланде десятки раз в день.
  items: |
    ได้ | можно; могу | mn=«Дай!» Можно! уверенно, сверху вниз | pic=👌
    ได้·ไหม·ครับ | можно? получится? | mn=Просишь «даай май?» как «дай мне?»: «даай» строго вниз, «май?» вопросом вверх
    ไม่·ได้·ครับ | нельзя; не получится | mn=«Май» не + «даай» можно: «не дай», значит нельзя; оба слога строго, сверху вниз
    เข้าใจ | понимать | mn=дословно «войти в сердце»: понял, значит дошло до сердца
    ไม่·เข้าใจ·ครับ | не понимаю | mn=«Май» не, строго вниз + «войти в сердце» (понимать): в сердце не вошло
    เข้าใจ·ไหม·ครับ | понятно? вы понимаете? | mn=Дошло ли до сердца: «май?» вопросом, снизу вверх
    ใช่·ไหม·ครับ | правда? так ведь? | ставится в конец фразы, как «..., да?» | mn=«Чай» верно, строго вниз + «май?» ли, вопросом вверх: верно ли, так ведь?
  mission: Когда что-то непонятно, скажи это по-тайски | ไม่·เข้าใจ·ครับ

- id: s2_03
  title: Цифры от 0 до 10
  intro: |
    Тайский счёт простой и логичный. Выучи эти слова, и остальные числа соберутся сами.

    Следи за тонами: สาม (sǎam) «три» восходящий, สี่ (sìi) «четыре» низкий. Спутаешь, и продавец услышит другую цифру.
  items: |
    ศูนย์ | ноль | mn=«Ноль?» переспрашиваешь удивлённо | pic=0️⃣
    หนึ่ง | один | mn=«Один...» устало, коротко и низко | pic=1️⃣
    สอง | два
    สาม | три | mn=«Три? Сам?» переспрашиваешь | pic=3️⃣
    สี่ | четыре | mn=«Четыре...» тихо и вполголоса | pic=4️⃣
    ห้า | пять
    หก | шесть | mn=Шесть шайб в хоккее: коротко и низко | pic=6️⃣
    เจ็ด | семь | mn=Семь реактивных джетов пролетели низко | pic=7️⃣
    แปด | восемь | mn=«Восемь...» устало, низко | pic=8️⃣
    เก้า | девять | mn=Нокаут в девятом раунде: строго, сверху вниз | pic=9️⃣
    สิบ | десять | mn=«Десять...» сиплым низким голосом | pic=🔟
  mission: Посчитай вслух по-тайски до десяти, пока ждёшь чего-нибудь | หนึ่ง สอง สาม สี่ ห้า หก เจ็ด แปด เก้า สิบ

- id: s2_04
  title: Цены и большие числа
  intro: |
    Большие числа собираются как конструктор.
    สิบ (sìp) 10, สิบสอง 12.
    ยี่สิบ (yîi-sìp) 20. Это исключение: не «два-десять», а yîi.
    สามสิบ 30, สี่สิบ 40 и дальше ровно по правилу.
    Единица на конце превращается в เอ็ด (èt): 11 สิบเอ็ด, 21 ยี่สิบเอ็ด.
    ร้อย (rɔ́ɔi) 100, พัน (phan) 1000.

    Цену спрашивают одной фразой: เท่าไหร่ครับ (thâo-rài khráp)?
  fem: |
    เท่าไหร่ครับ (thâo-rài khráp)? => เท่าไหร่คะ (thâo-rài khá)?
  items: |
    สิบ·เอ็ด | одиннадцать | mn=«Сип» десять + «эт» как «этот» один: десять и этот один, оба низко
    สิบ·สอง | двенадцать | mn=«Сип» десять, низко + «соонг?» два, вопросом вверх: десять и два
    ยี่สิบ | двадцать | mn=Две десятки: «йии» строго, сверху вниз, и «сип» десять низко
    ยี่สิบ·เอ็ด | двадцать один | mn=Двадцать «йии-сип» и «этот» один: «эт» тоже низко
    ห้า·สิบ | пятьдесят | mn=Пятерня хлопает «хаа» строго вниз, десять «сип» низко: пять по десять
    ร้อย | сто | mn=«Рой из ста пчёл!» удивлённо и высоко | pic=💯
    พัน | тысяча | mn=Богатый пан с тысячей в кармане, спокойный и ровный
    บาท | бат (деньги) | mn=Деньги считают тихо и вполголоса
    เท่าไหร่·ครับ | сколько стоит? | mn=Спрашиваешь цену райского уголка: «тхао-рай», «тхао» строго вниз, «рай» низко
    ร้อย·ห้า·สิบ·บาท | сто пятьдесят бат | mn=«Роой» сто + «хаа-сип» пятьдесят + «баат», как батон: батон за 150
  mission: Спроси цену чего угодно по-тайски | เท่าไหร่·ครับ

- id: s2_05
  title: Кофейня
  split: 4
  intro: |
    Заказ строится по одной схеме: ขอ (khɔ̌ɔ) + что хочешь + ครับ. ขอ значит «дайте, можно мне», это самый простой и вежливый способ попросить.

    Тайцы любят сладкое, и в кофе по умолчанию кладут много сахара. Хочешь меньше, скажи หวานน้อย (wǎan nɔ́ɔi), «поменьше сладкого».
  fem: |
    ขอ (khɔ̌ɔ) + что хочешь + ครับ. => ขอ (khɔ̌ɔ) + что хочешь + ค่ะ.
  items: |
    ขอ | дайте, можно мне | mn=Просишь, голос уходит вверх, как вопрос: «можно?»
    กาแฟ | кофе | mn=почти как «кафе» | pic=☕
    เย็น | холодный; со льдом | mn=Холодный и спокойный, ровный, как лёд | pic=🧊
    หวาน | сладкий | mn=«Ваня, сладкое?» переспрашиваешь | pic=🍬
    หวาน·น้อย | поменьше сладкого | mn=«Ваан» сладко, вопросом вверх + «ноой» мало, высоко: Ване капельку, пусть не ноет
    ไม่·หวาน | без сахара | mn=«Май» не, строго вниз + «ваан» сладко, вопросом вверх: Ване без сахара
    ขอ·กาแฟ·เย็น·ครับ | холодный кофе, пожалуйста | mn=дословно: «кхоо» дайте + «каа-фээ» кофе + «йен» холодный, ровно, как лёд
    ทาน·ที่·นี่ | здесь (буду есть тут) | mn=Таня («тхаан», ровно) ест здесь: «тхии-нии», оба слога строго вниз
    เอา·กลับ | с собой | mn=«Ао» берёшь + «клап!» хлопает крышка контейнера, низко: еда с собой
  dialog: |
    t: สวัสดี·ค่ะ รับ·อะไร·ดี·คะ | Здравствуйте! Что закажете?
    me: ขอ·กาแฟ·เย็น·ครับ | Холодный кофе, пожалуйста
    t: หวาน·ปกติ#2·ไหม·คะ | Обычная сладость?
    me: หวาน·น้อย·ครับ | Поменьше сладкого
    t: ทาน·ที่·นี่·หรือ·เอา·กลับ·คะ | Здесь или с собой?
    me: เอา·กลับ·ครับ | С собой
    t: ห้า·สิบ·ห้า·บาท·ค่ะ | 55 бат
    me: นี่·ครับ ขอบคุณ·ครับ | Вот, пожалуйста. Спасибо!
  mission: Закажи кофе целиком по-тайски | ขอ·กาแฟ·เย็น·ครับ

- id: s2_06
  title: "Кафе: еда"
  split: 6
  intro: |
    Главный вопрос в тайском кафе: насколько остро. Тайское «чуть-чуть» для нас бывает очень острым, так что смело говори ไม่เผ็ด (mâi phèt), «не остро».

    Позвать официанта: พี่ครับ (phîi khráp), «старший!». Звучит тепло, так делают все.

    Счёт просят фразой เช็คบิล (chék-bin), от английского «check bill».
  fem: |
    พี่ครับ (phîi khráp) => พี่คะ (phîi khá)
  items: |
    อาหาร | еда | mn=«А хана?» Еда кончилась? переспрашиваешь в конце | pic=🍲
    อร่อย | вкусный | mn=«А, рой!» Мёд от пчёл вкусный | pic=😋
    อร่อย·มาก | очень вкусно | mn=Булочка с мёдом и маком: «а-рой» вкусно, низко + «маак» очень, строго вниз
    เผ็ด | острый | mn=Острое! коротко выдыхаешь, низко | pic=🌶️
    ไม่·เผ็ด | не острый | mn=«Май» не, строго вниз + «пхэт» остро, коротко и низко: не острое
    เผ็ด·นิดหน่อย | чуть-чуть острый | mn=«Пхэт» остро + «нит-ной» чуть-чуть (высоко, низко): перца на тоненькую нить
    ผัด·ไทย | пад тай | mn=«Пхат» жарить (низко) + «тхай» как «тай-» в Таиланде: жарено по-тайски
    ต้ม·ยำ·กุ้ง | том ям с креветками | mn=Том в яме ловит креветку: «том-ям-кунг», «том» и «кунг» строго вниз
    น้ำ·เปล่า | простая вода | mn=дословно «вода пустая», без вкуса: «наам» вода, высоко + «плао» пустая, низко
    เช็ค·บิล·ครับ | счёт, пожалуйста | mn=«Чек» высоко, «бин» ровно, почти «билл»: чек и счёт на стол
  dialog: |
    t: รับ·อะไร·ดี·คะ | Что закажете?
    me: ขอ·ผัด·ไทย·ไก่·ครับ | Пад тай с курицей, пожалуйста
    t: เผ็ด·ได้·ไหม·คะ | Острое можно?
    me: ไม่·เผ็ด·ครับ | Не остро, пожалуйста
    t: รับ·น้ำ·อะไร·คะ | Что будете пить?
    me: ขอ·น้ำ·เปล่า·ครับ | Воду, пожалуйста
    t: รับ·อะไร·เพิ่ม·ไหม·คะ | Что-нибудь ещё?
    me: พอ·แล้ว·ครับ ขอบคุณ·ครับ | Достаточно, спасибо
  mission: Скажи повару или официанту, что было очень вкусно | อร่อย·มาก·ครับ

- id: s2_07
  title: Где? Направления
  split: 6
  intro: |
    อยู่ (yùu) значит «находиться». «Где?» это ที่ไหน (thîi-nǎi), и оно тоже встаёт в конец: «туалет находится где?».

    Слушая ответ, смотри на руки: тайцы часто показывают направление жестом, а слова его подтверждают.
  items: |
    ที่ไหน | где? | mn=«Где?» вторая половина вопросом вверх
    อยู่ | находиться | mn=Устало отвечаешь, где находишься: «юу», низко
    ห้องน้ำ·อยู่·ที่ไหน·ครับ | где туалет? | mn=дословно: «хонг-наам» комната с водой + «юу» находится + «тхии-най» где
    ตรง·ไป | прямо | mn=Пай-мальчик тронулся прямо вперёд: «тронг-пай», оба слога ровно
    เลี้ยว·ซ้าย | поверните налево | mn=Лёва свернул налево за сайкой: «лиао саай», оба слога высоко
    เลี้ยว·ขวา | поверните направо | mn=Лёва свернул направо к лягушке: «лиао» высоко, «кхваа» как «ква», снизу вверх
    ที่นี่ | здесь | mn=Здесь ни шагу дальше: «тхии-нии», оба слога строго, сверху вниз
    ที่นั่น | там | mn=Вон там лепёшка нан: «тхии-нан», оба слога строго, сверху вниз
    ใกล้ | близко | mn=«Близко!» строго и коротко, сверху вниз
    ไกล | далеко | mn=«Дале-еко...» ровно и протяжно, как длинная дорога
  mission: Спроси, где туалет, даже если знаешь | ห้องน้ำ·อยู่·ที่ไหน·ครับ

- id: s2_08
  title: Такси и Grab
  split: 3
  intro: |
    Водителю достаточно ไป (pai) и названия места: «ไป สนามบิน», «в аэропорт». Дальше пригодятся «прямо», «налево», «направо» из прошлого урока и главная фраза จอดตรงนี้ (jɔ̀ɔt trong-níi), «остановите здесь».

    В обычном такси спроси про счётчик до посадки: ใช้มิเตอร์ไหม (chái mí-təə mǎi).

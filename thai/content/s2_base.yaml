- id: s2_10
  title: Рынок и торг
  split: 5
  intro: |
    На рынке торгуются, но мягко и с улыбкой. Спроси цену, удивись แพงจัง (phɛɛng jang), «ого, дорого», и попроси скидку: ลดได้ไหม (lót dâai mǎi).

    Показывать можно пальцем со словом อันนี้ (an-níi), «вот это».
  items: |
    อัน·นี้ | вот это | mn=Аня тычет в прилавок и говорит «ан-нии»: вот это, «нии» высоко
    อัน·นั้น | вон то | mn=Вон тот ананас: «ан-нан», показываешь вдаль, «нан» высоко
    แพง | дорогой | mn=«Дорого...» ровно констатируешь
    แพง·จัง | ого, дорого | mn=«Пхээнг» дорого + «джанг» как «ух ты!»: ух ты, как дорого; оба слога ровно
    ถูก | дешёвый | mn=Тук-тук, и дёшево: тихо радуешься
    ลด·ได้·ไหม·ครับ | скинете? | mn=«Лот» с распродажи (высоко) + «даай май?» как «дай мне?»: можно дешевле
    กิโล | килограмм | mn=как «кило» | pic=⚖️
    เอา·อัน·นี้·ครับ | беру вот это | mn=дословно: «ао» беру + «ан-нии» вот это: показываешь пальцем и берёшь
  mission: Спроси на рынке, скинут ли цену | ลด·ได้·ไหม·ครับ

- id: s2_11
  title: "Время глагола: จะ, แล้ว, กำลัง"
  split: 3
  intro: |
    Глагол в тайском не меняется никогда. Время показывают маленькие слова вокруг него:

    จะ (jà) перед глаголом: будущее. ผมจะไป «я пойду».
    แล้ว (lɛ́ɛo) после: уже сделано. กินแล้ว «уже поел».
    กำลัง (kam-lang) перед глаголом: прямо сейчас. กำลังกิน «ем сейчас».
    เคย (khəəi) перед глаголом: когда-то доводилось. เคยไป «бывал».

    Часто время вообще не называют, если оно понятно из разговора.
  fem: |
    ผมจะไป «я пойду» => ฉันจะไป «я пойду»
    กินแล้ว «уже поел» => กินแล้ว «уже поела»
    เคยไป «бывал» => เคยไป «бывала»
  items: |
    ผม·จะ·ไป | я пойду, я поеду | mn=«Джа» (да, буду) низко + «пай» идти (ровно): значит, пойду
    กิน·แล้ว | уже поел | fru=уже поела | mn=«Кин» есть, как «кинуть в рот» + «лээо» уже, высоко: уже съедено
    กำลัง·กิน | ем сейчас | mn=«Кам-ланг» в разгаре + «кин» есть, кинуть в рот: ем прямо сейчас
    เคย·ไป | бывал, доводилось ездить | fru=бывала, доводилось ездить | mn=«Кхёёй» доводилось + «пай» ехать, идти: доводилось бывать, оба слога ровно
    ไม่·เคย | никогда не (доводилось) | mn=«Май» не, строго вниз + «кхёёй» доводилось, ровно: никогда не доводилось
    กิน·ข้าว·หรือ·ยัง·ครับ | ты уже ел? | тайское «как дела»: так здороваются, отвечать подробно про еду не нужно | mn=дословно: «кин-кхаао» есть рис + «рыы-янг» или ещё нет, «рыы» вопросом вверх
    กิน·แล้ว·ครับ | уже поел | fru=уже поела | mn=Ответ на «поели?»: «кин лээо», кинуть в рот и всё; «лээо» высоко
    ยัง·ครับ | ещё нет | mn=На вопрос «Уже поели?» отвечаешь «янг»: ещё нет, ровно и спокойно

- id: s2_12
  title: "Кто есть кто: พี่, น้อง, เขา"
  intro: |
    Тайцы обращаются друг к другу как к родственникам. Старшего называют พี่ (phîi), младшего น้อง (nɔ́ɔng). Официанту, продавцу или водителю примерно твоего возраста подойдёт พี่.

    Местоимения часто пропускают: «поел?» вместо «ты поел?». Кто есть кто, понятно из разговора.
  items: |
    พี่ | старший (обращение)
    น้อง | младший (обращение) | mn=Младший радостно подпрыгивает вверх
    เขา | он, она | mn=«Он? Она?» переспрашиваешь
    เรา | мы | mn=Мы все вместе, спокойно и ровно
    เพื่อน | друг | mn=Друга зовёшь уверенно, сверху вниз
    ครอบครัว | семья | pic=👪 | mn=Вся семья за столом, укроп и круассаны: «кхрооп» строго вниз, «кхруа» ровно
    ภรรยา | жена | fth=สามี | fru=муж | mn=«Пхан-яа» звучит почти как «пани» (жена пана), оба слога ровно | fmn=Муж всё делает сам: «саа-мии», «саа» вопросом вверх, «мии» ровно
    ลูก | ребёнок (сын или дочь) | mn=Ребёнок плачет от лука | pic=👶

- id: s2_13
  title: Счётные слова
  intro: |
    Считая предметы, тайцы добавляют счётное слово: «пиво две бутылки», «человек три человека». Схема: что + сколько + счётное слово.

    Самые нужные: คน (khon) для людей, แก้ว (kɛ̂ɛo) для стаканов, ขวด (khùat) для бутылок, จาน (jaan) для тарелок, ตัว (tua) для животных и одежды.

    Не знаешь нужного слова, говори อัน (an): поймут.
  items: |
    คน | человек; счётное слово для людей | mn=Человек на коне, спокойно и ровно
    แก้ว | стакан | mn=Стакан ставишь на стол строго, сверху вниз | pic=🥛
    ขวด | бутылка | mn=Квас в бутылке, тихо | pic=🍾
    จาน | тарелка | mn=Жан несёт тарелку ровно, чтобы не уронить | pic=🍽️
    ตัว | счётное слово для животных и одежды | mn=«Туа» похоже на «туша» и «тулуп»: считаешь зверей и одежду, ровно и спокойно
    สอง·คน | два человека | mn=Двое на коне: «соонг» вопросом вверх + «кхон» (человек) ровно
    เบียร์·สอง·ขวด | две бутылки пива | mn=Пиво «биа» (почти «бир») + «соонг» два + «кхуат» бутылка, как квас
    น้ำ·เปล่า·หนึ่ง·ขวด | одна бутылка воды | mn=Просишь: «наам-плао» вода, «нынг» один (низко), «кхуат» бутылка
    ข้าว·ผัด·สอง·จาน | две тарелки жареного риса | mn=Жан несёт тарелки («джаан»): «кхаао-пхат» жареный рис, «соонг» два
  mission: Закажи что-нибудь, назвав количество со счётным словом | น้ำ·เปล่า·หนึ่ง·ขวด

- id: s2_14
  title: Время и дни
  intro: |
    วันนี้ (wan-níi) сегодня, พรุ่งนี้ (phrûng-níi) завтра, เมื่อวาน (mʉ̂a-waan) вчера.

    Время ставится в начало или в конец фразы: พรุ่งนี้ผมจะไป «завтра я пойду».
  fem: |
    พรุ่งนี้ผมจะไป => พรุ่งนี้ฉันจะไป
  items: |
    วันนี้ | сегодня | mn=дословно «день этот»: «ван» день, ровно + «нии» этот, высоко
    พรุ่งนี้ | завтра | mn=Завтра идём на пруд: «пхрунг-нии», «пхрунг» строго вниз, «нии» высоко
    เมื่อวาน | вчера | mn=Вчера мама мыла ванну: «мыа-ваан», «мыа» строго вниз, «ваан» ровно
    ตอน·เช้า | утром | mn=Утром всем «чао!»: «тоон-чаао», «тоон» ровно, «чаао» высоко
    ตอน·เย็น | вечером | mn=«Тоон» время + «йен» прохлада: время прохлады, оба слога ровно
    ตอนนี้ | сейчас | mn=«Тоон» время + «нии» этот: именно этот момент, «нии» высоко
    กี่·โมง·ครับ | который час? | mn=«Кии» сколько, низко + «моонг» как гонг: сколько ударов гонга
    อาทิตย์·หน้า | на следующей неделе | mn=«Аа-тхит» неделя («тхит» высоко) + «наа» впереди, строго вниз: неделя, что впереди
    พรุ่งนี้·ผม·จะ·ไป | завтра я пойду | mn=Завтра на пруд: «пхрунг-нии» + «джа» буду + «пай» идти

- id: s2_15
  title: Вежливые просьбы
  intro: |
    Три слова делают любую просьбу мягкой:
    ขอ (khɔ̌ɔ) в начале: «можно мне».
    ช่วย (chûai) в начале: «помогите, будьте добры».
    หน่อย (nɔ̀i) в конце: «немножко, пожалуйста».

    ช่วยพูดช้าๆ หน่อย, «говорите помедленнее, пожалуйста». С этой фразой разговор с тайцем становится реальным.
  items: |
    ช่วย·พูด·ช้า·ๆ·หน่อย·ครับ | говорите помедленнее, пожалуйста | mn=«Чуай» помогите + «пхуут» говорить + «чаа-чаа» ча-ча-ча, медленно + «ной» чуть
    พูด·อีก·ที·ได้·ไหม·ครับ | можете повторить? | mn=дословно: «пхуут» говорить + «иик-тхии» (как «ик!», ещё раз) + «даай май?» можно ли
    ขอ·เมนู·หน่อย·ครับ | меню, пожалуйста | mn=«Кхоо?» дайте, вопросом + «мээ-нуу» почти «меню» + «ной» смягчает просьбу
    ช่วย·ด้วย | помогите! | mn=Зовёшь на помощь: «чуай-дуай!», как «дуй сюда!», оба слога строго, сверху вниз
    รอ·สักครู่ | подождите минутку | mn=«Роо» ждать + «сак-кхруу» как «сок и кружка» («кхруу» строго вниз): налью сок в кружку
    พูด·ภาษา·อังกฤษ·ได้·ไหม·ครับ | вы говорите по-английски? | mn=дословно: «пхуут» говорить + «пхаа-саа» язык + «анг-крит» (Англия) + «даай май?» можно ли
    ผม·พูด·ภาษา·ไทย·ได้·นิดหน่อย | я немного говорю по-тайски | mn=дословно: «пхуут пхаа-саа тхай» говорить по-тайски + «даай» могу + «нит-ной» чуть
  mission: Попроси кого-нибудь говорить помедленнее | ช่วย·พูด·ช้า·ๆ·หน่อย·ครับ

- id: s2_16
  title: Хочу и нравится
  split: 4
  intro: |
    ชอบ (chɔ̂ɔp) «нравится, люблю»: ชอบทะเล «люблю море».
    อยาก (yàak) «хочу» + действие: อยากไปทะเล «хочу на море».
    หิว (hǐu) «голоден», หิวน้ำ «хочу пить», дословно «голоден по воде».
  items: |
    ชอบ | нравится, люблю | mn=«Шопинг нравится!» уверенно, сверху вниз
    ไม่·ชอบ | не нравится | mn=Шопинг не нравится: «май чооп», оба слога строго, сверху вниз
    อยาก | хотеть (что-то сделать) | mn=«Хочу-у...» тихо тянешь
    อยาก·ไป·ทะเล | хочу на море | mn=«Яак» хочу-у (устало) + «пай» идти + «тха-лее» (талая вода течёт в море)
    หิว | голодный | mn=«Голоден?» переспрашивает мама | fmn=«Голодна?» переспрашивает мама
    หิว·น้ำ | хочу пить | mn=дословно «голоден по воде»: «хиу?» вопросом вверх + «наам» вода, высоко
    เหนื่อย | устал | mn=«Ну-уй...» устало и низко | pic=😩
    ง่วง | хочу спать | mn=Строго зеваешь сверху вниз: спать! | pic=😴
    ชอบ·อาหาร·ไทย·มาก | очень люблю тайскую еду | mn=дословно: «чооп» нравится + «аа-хаан» еда + «тхай» тайский + «маак» очень
  mission: Скажи тайцу, что очень любишь тайскую еду | ชอบ·อาหาร·ไทย·มาก·ครับ

- id: s3_08
  title: "Алфавит: низкий класс"
  kind: letters
  quiz: [letter, read]
  intro: |
    Низкий класс самый большой: ค ช ซ ท พ ฟ ฮ и тянущиеся ง ม น ย ร ล ว, которые ты уже знаешь. Правила у него свои:
    живой слог без знака: средний. คน (khon)
    мёртвый слог с короткой гласной: высокий. รัก (rák)
    мёртвый слог с долгой гласной: нисходящий. มาก (mâak)
    со знаком ่: нисходящий. พี่ (phîi)
    со знаком ้: высокий. ช้าง (cháang)

    Звуки kh, ch, th, ph, f, s, h тебе знакомы по высокому классу. Буквы разные, звук одинаковый, а тоны по разным правилам.

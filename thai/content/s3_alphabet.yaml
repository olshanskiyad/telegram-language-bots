- id: s3_07
  title: "Алфавит: высокий класс"
  kind: letters
  quiz: [letter, read]
  intro: |
    Высокий класс: ข ฉ ถ ผ ฝ ส ห и пара редких. Звуки знакомые, но тоны свои:
    живой слог без знака: восходящий. ขา (khǎa), สอง (sɔ̌ɔng)
    мёртвый слог: низкий. สิบ (sìp)
    со знаком ่: низкий. ข่า (khàa)
    со знаком ้: нисходящий. ข้าว (khâao)

    Тайские школьники запоминают высокий класс фразой ผีฝากถุงข้าวสารให้ฉัน, «призрак передал мне мешок риса»: в ней все семь букв по порядку.

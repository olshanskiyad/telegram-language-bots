- id: s3_09
  title: "Алфавит: немые ห и อ"
  kind: letters
  quiz: [read]
  intro: |
    Как написать восходящий тон у слова на m, n, y, r, l, w, если эти буквы низкого класса? Перед ними ставят немую ห. Она не читается, но переводит слог в высокий класс:
    หมา (mǎa) «собака», หนู (nǔu) «мышь», ใหม่ (mài) «новый».

    То же делает немая อ перед ย, но таких слов всего четыре: อยู่, อย่า, อย่าง, อยาก. Они читаются по правилам среднего класса.
  read: |

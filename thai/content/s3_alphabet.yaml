- id: s3_11
  title: "Алфавит: редкие буквы и особые знаки"
  kind: letters
  quiz: [letter, read]
  intro: |
    Редкие буквы живут в основном в словах из пали и санскрита, а звучат как знакомые:
    ศ и ษ как ส (s), ภ как พ (ph), ธ и ฐ как ท (th), ณ как น (n), ญ как «й» в начале и n в конце, ฆ как ค (kh), ฬ как ล (l), ฎ как ด (d), ฏ как ต (t).

    И три особых значка:
    ์ над буквой делает её немой: เบียร์ (bia), ศูนย์ (sǔun).
    ็ укорачивает гласную: เป็น (pen), เก็บ (kèp).
    ๆ повторяет слово: ช้าๆ «медленно».

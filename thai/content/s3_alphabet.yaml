# Ступень 3. Алфавит. Вне основного пути, открывается командой /abc.
# Буква: символ | класс (m средний, h высокий, l низкий) | звук в начале | звук в конце (- нет) | слово-имя | перевод | заметка
# chars: новые гласные и знаки урока. В словах read только пройденные буквы и знаки (сборщик проверяет).
- id: s3_01
  title: "Алфавит: как устроено письмо"
  kind: letters
  quiz: [letter, read]
  intro: |
    Тайское письмо выглядит как вязь, но устроено логично.

    Согласных 44, в ходу около 30, остальные редкие. Гласные пишутся вокруг согласной: после, над, под и даже перед ней. Пробелов между словами нет, пробел ставят между фразами. Заглавных букв нет.

    У каждой согласной есть имя со словом-подсказкой, как «А, арбуз»: ก зовут kɔɔ kài, «к, как в слове курица».

    Сегодня три буквы и первая гласная า (aa), она пишется после согласной. กา читается kaa.
  letters: |
    ก | m | k | k | ไก่ | курица
    ม | l | m | m | ม้า | лошадь
    น | l | n | n | หนู | мышь
  chars: า
  read: |
    กา | ворона
    มา | приходить
    นา | рисовое поле

- id: s3_02
  title: "Алфавит: гласные над и под буквой"
  kind: letters
  quiz: [letter, read]
  intro: |
    Ещё пять согласных и две гласные.

    ี (ii) пишется над согласной, ู (uu) под ней. ดี читается dii, ดู читается duu.

    Буква อ особая: она немая и держит гласную, когда слог начинается с гласного звука. อา читается просто aa.

    Обрати внимание на пары ด (d) и ต (t), บ (b) и ป (p). ต и ป звучат как русские т и п, без выдоха.
  letters: |
    ด | m | d | t | เด็ก | ребёнок
    ต | m | t | t | เต่า | черепаха
    บ | m | b | p | ใบ·ไม้ | лист
    ป | m | p | p | ปลา | рыба
    อ | m | - | - | อ่าง | таз | немая, держит гласную
  chars: ีู
  read: |
    ดี | хороший
    ดู | смотреть
    ตา | глаз
    ปู | краб
    มี | иметь, есть
    ปี | год
    อา | дядя, тётя (младшие брат или сестра отца)

- id: s3_03
  title: "Алфавит: живые слоги и средний тон"
  kind: letters
  quiz: [letter, read]
  intro: |
    Слог может кончаться согласной. Сегодня буквы, звук которых тянется: ง (ng), ว, ย, ร, ล.

    В конце слога часть букв читается иначе: ร и ล дают n, ว складывается с гласной (าว = aao), ย тоже (าย = aai).

    Первое правило тонов. Слог, который кончается долгой гласной или на m, n, ng, w, y, называется живым. Если первая буква среднего или низкого класса и тонового знака нет, живой слог читается средним тоном. Все слова этого урока ровные, средние.
  letters: |
    ง | l | ng | ng | งู | змея
    ว | l | w | w | แหวน | кольцо | в конце слога складывается с гласной: าว = aao
    ย | l | y | y | ยักษ์ | великан | в конце слога складывается с гласной: าย = aai
    ร | l | r | n | เรือ | лодка | в быстрой речи часто звучит как l
    ล | l | l | n | ลิง | обезьяна
  read: |
    งาน | работа
    นาน | долго
    ตาม | следовать, по (чему-то)
    บาง | некоторые
    ยาว | длинный
    ดาว | звезда
    งู | змея
    รอ | ждать

- id: s3_04
  title: "Алфавит: гласные перед буквой"
  kind: letters
  quiz: [letter, read]
  intro: |
    Некоторые гласные пишутся ПЕРЕД согласной, а читаются после неё: เ (ee), แ (ɛɛ), โ (oo), ไ и ใ (обе ai).

    Читай так: сначала согласная, потом гласная. เรา читается rao: เ и า вместе дают ao.

    ไ и ใ звучат одинаково. ใ встречается всего в двадцати словах, их просто запоминают: ใจ «сердце», ใน «в», ใหม่ «новый».

    Новая буква จ: мягкое «чь» без выдоха.
  letters: |
    จ | m | j | t | จาน | тарелка
  chars: เแโไใ
  read: |
    เรา | мы
    เอา | брать
    ไป | идти, ехать
    ใจ | сердце, душа
    ใน | в, внутри
    แมว | кошка
    แดง | красный
    โมง | час (о времени)
    โรงแรม | гостиница

- id: s3_05
  title: "Алфавит: мёртвые слоги и низкий тон"
  kind: letters
  quiz: [read]
  intro: |
    Второе правило тонов: мёртвые слоги.

    Слог мёртвый, если кончается короткой гласной или на звук k, p, t. Если первая буква среднего класса (ก จ ด ต บ ป อ) и тонового знака нет, мёртвый слог читается низким тоном: จะ (jà), กับ (kàp).

    Новые короткие гласные: ะ (a) после согласной, ั (a) над ней в середине слога, ิ (i) и ุ (u).

    И хитрость: если в закрытом слоге гласная не написана вовсе, читается короткое o. ตก читается tòk, จบ читается jòp.
  chars: ะัิุ
  read: |
    จะ | буду (частица будущего)
    กับ | с, вместе с
    ปิด | закрывать; закрыто
    ติด | прилипнуть, застрять
    จับ | ловить, хватать
    ตก | падать
    จบ | кончаться
    บิน | летать

- id: s3_06
  title: "Алфавит: тоновые знаки"
  kind: letters
  quiz: [read]
  intro: |
    Тоновые знаки пишутся над согласной. С буквами среднего класса правило самое простое, знак прямо называет тон:
    ่  низкий
    ้  нисходящий
    ๊  высокий
    ๋  восходящий

    ป่า (pàa) «лес», ป้า (pâa) «тётя». Если над согласной уже стоит гласная, знак пишется ещё выше.

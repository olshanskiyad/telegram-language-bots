# Ступень 4. Темы: жизнь в Таиланде, поездки, общение.
- id: s4_01
  title: "Жизнь: аренда жилья"
  intro: |
    Аренда в Таиланде обычно помесячная: เดือนละ значит «в месяц». Коммуналку считают отдельно: ค่าไฟ за электричество и ค่าน้ำ за воду. Залог обычно за один-два месяца, это มัดจำ (mát-jam).

    ค่า (khâa) ты помнишь по урокам тонов: «цена, плата». Здесь оно почти в каждом слове.
  items: |
    ห้อง | комната; номер | mn=Комната в «Хонг-Конге»: «хонг», строго, сверху вниз
    เช่า | снимать, арендовать | mn=Снимаешь жильё вместе с собакой чау-чау: «чао», строго, сверху вниз
    ค่า·เช่า | арендная плата | mn=«Кхаа» плата, строго («Сколько?!») + «чао» снять: плата за съём
    เดือน·ละ | в месяц | mn=Дыня раз в месяц: «дыан» почти «дыня» (ровно) + «ла» высоко, как нота «ля»
    หมื่น | десять тысяч | mn=Десять тысяч мыльных пузырей: «мыын», устало и низко
    ค่า·ไฟ | плата за электричество | mn=Плата («кхаа», строго вниз) за огонь-свет: «фай» как файер, ровно
    ค่า·น้ำ | плата за воду | mn=Плата («кхаа», строго вниз) за воду («наам», высоко)
    มัดจำ | залог | mn=Залог: банка джема, «мат-джам», «мат» высоко, «джам» ровно
    สัญญา | договор | mn=Договор подписал Саня: «сан-яа», «сан» вопросом вверх, «яа» ровно
  dialog: |
    t: สวัสดี·ค่ะ สนใจ·ห้อง·ไหน·คะ | Здравствуйте! Какая квартира интересует?
    me: ห้อง·นี้·เดือน·ละ·เท่าไหร่·ครับ | Сколько эта стоит в месяц?
    t: เดือน·ละ·หนึ่ง·หมื่น·ห้า·พัน·บาท·ค่ะ | 15 000 бат в месяц
    me: รวม·ค่า·ไฟ·ไหม·ครับ | Электричество включено?
    t: ไม่·รวม·ค่ะ ค่า·ไฟ·หน่วย·ละ·แปด·บาท | Не включено, электричество 8 бат за киловатт
    me: มัดจำ·กี่·เดือน·ครับ | Залог за сколько месяцев?
    t: สอง·เดือน·ค่ะ | За два месяца

- id: s4_02
  title: "Жизнь: врач и аптека"
  split: 6
  intro: |
    Аптека (ร้านขายยา) в Таиланде на каждом углу, и фармацевт часто сам советует лекарство. Опиши, что болит: ปวด (pùat) значит «болеть, ныть», дальше часть тела.

    ปวดหัว «болит голова», ปวดท้อง «болит живот». Температура это เป็นไข้, дословно «быть в жару».
  items: |
    ไม่·สบาย | плохо себя чувствую, болею | mn=«Май» не, строго вниз + «са-баай» хорошо, уютно (баю-бай): нездоровится
    ปวด | болеть, ныть | mn=Пуанты жмут: «пуат», ныть и болеть, устало и низко
    ปวด·หัว | болит голова | mn=Пуанты жмут («пуат»), и гудит голова («хуа», снизу вверх)
    ปวด·ท้อง | болит живот | mn=Тонна лапши в животе: «тхоонг», высоко, и «пуат» болит, низко
    เป็น·ไข้ | температура, жар | mn=«Пен» быть + «кхай» жар (строго вниз, не яйцо!): быть в жару
    ไอ | кашель; кашлять | mn=Кашляешь и говоришь «ай»: ровно и спокойно, как «ай, першит!»
    ยา | лекарство | mn=«Я» принимаю лекарство: «яа», ровно и спокойно
    แพ้ | аллергия (на что-то) | mn=От аллергии чихаешь: «пхээ!», высоко и протяжно
    ก่อน·อาหาร | до еды | mn=До еды нельзя конфету: «коон» вполголоса + «аа-хаан» еда
    หลัง·อาหาร | после еды | mn=«Ланг» как лангуст на десерт, вопросом вверх + «аа-хаан» еда
  dialog: |
    t: เป็น·อะไร·คะ | Что беспокоит?
    me: ผม·ปวด·หัว·และ·เป็น·ไข้·ครับ | У меня болит голова и температура
    t: แพ้·ยา·อะไร·ไหม·คะ | Аллергия на лекарства есть?
    me: ไม่·แพ้·ครับ | Нет
    t: กิน·ยา·นี้·หลัง·อาหาร·ค่ะ | Это принимайте после еды
    me: ขอบคุณ·ครับ | Спасибо
  mission: Зайди в аптеку и спроси, есть ли лекарство от головы | มี·ยา·แก้·ปวด·หัว·ไหม·ครับ

- id: s4_03
  title: "Жизнь: банк и деньги"
  intro: |
    В Таиланде почти всё оплачивают переводом по QR через банковское приложение, наличные нужны на рынке и в такси.

    โอนเงิน (oon-ngən) «перевести деньги» слышишь постоянно: тайцы говорят «переведу» вместо «заплачу».
  items: |
    ธนาคาร | банк | mn=Тонна денег в банке: «тха-наа-кхаан», «тха» высоко, дальше ровно
    บัญชี | счёт в банке | mn=«Бан» от «банк» + «чии» как «чек»: банковский счёт, оба слога ровно
    เปิด·บัญชี | открыть счёт | mn=Пётр («пёёт», устало и низко) открывает счёт в банке: «бан-чии»
    โอน·เงิน | перевести деньги | mn=ООН переводит деньги: «оон» + «нгён», оба слога ровно
    ถอน·เงิน | снять наличные | mn=Антон достаёт наличные из банкомата: «тхоон нгён», «тхоон» вопросом вверх
    บัตร | карта | mn=Бэтмен платит картой: «бат», коротко и низко
    โอน·ได้·ไหม·ครับ | можно переводом? | mn=«Оон» как ООН (переводит) + «даай май?» как «дай мне?»: можно ли переводом
    เงิน·ไม่·พอ | денег не хватает | mn=дословно: «нгён» деньги + «май» не, строго вниз + «пхоо» хватает, ровно
    หนังสือ·เดินทาง | паспорт | mn=дословно: «нанг-сыы» книга + «дёён» идти + «тхаанг» путь: книга для дороги
  dialog: |
    me: โอน·ได้·ไหม·ครับ | Можно переводом?
    t: ได้·ค่ะ สแกน·ตรงนี้·ค่ะ | Можно, сканируйте здесь
    me: โอน·แล้ว·ครับ | Перевёл | fru=Перевела
    t: ขอบคุณ·ค่ะ | Спасибо

- id: s4_04
  title: "Жизнь: дома, соседи и мастер"
  intro: |
    Сломалось что-то в квартире: название вещи + เสีย (sǐa), «сломалось». แอร์เสีย «кондиционер сломался». Мастер это ช่าง (châang), починить ซ่อม (sɔ̂m).

    Соседи спросят ไปไหนมา, «где был?». Это тоже приветствие, подробно отвечать не нужно.
  fem: |
    «где был?» => «где была?»
  items: |
    แอร์ | кондиционер | mn=Кондиционер гонит «эйр»: тянешь «ээ», ровно и спокойно
    เสีย | сломался, испортился | mn=Шина шипит и сдувается: «сиа», сломалось, снизу вверх
    แอร์·เสีย·ครับ | кондиционер сломался | mn=«Ээ» кондиционер (эйр) + «сиа» шипит и сломан, снизу вверх
    ไฟ·ดับ | свет отключили | mn=Файер («фай», ровно) погас: «дап!» вполголоса, будто щёлкнул выключатель
    น้ำ·ไม่·ไหล | вода не идёт | mn=«Наам» вода, высоко, «май» не, «лай» как «лей»: вода не льётся, «лай» вопросом вверх
    ช่าง | мастер | mn=Мастер бьёт молотком: «чаанг!» строго, сверху вниз
    ซ่อม | чинить | mn=Чиним удочку, чтобы поймать сома: «сом», строго, сверху вниз
    ช่วย·ซ่อม·หน่อย·ได้·ไหม·ครับ | можете починить? | mn=«Чуай» помочь + «сом» чинить (удочку) + «ной» просьба + «даай май?» можно ли
    เพื่อน·บ้าน | сосед | mn=дословно: «пхыан» друг + «баан» дом: друг по дому, оба слога строго вниз
    ไป·ไหน·มา | где был? (приветствие) | fru=где была? (приветствие) | mn=«Пай» идти + «най?» куда (вопросом вверх) + «маа» прийти: ходили куда и вернулись
  dialog: |
    me: แอร์·เสีย·ครับ | Кондиционер сломался
    t: เป็น·อะไร·คะ | Что с ним?
    me: ไม่·เย็น·ครับ | Не холодит
    t: พรุ่งนี้·ช่าง·จะ·มา·ซ่อม·ค่ะ | Завтра мастер придёт и починит
    me: กี่·โมง·ครับ | Во сколько?
    t: สิบ·โมง·เช้า·ค่ะ | В десять утра

- id: s4_05
  title: "Поездки: отель"
  split: 3
  intro: |
    Для отеля почти всё уже знаешь: ห้อง «номер», กี่ «сколько». Новое: จอง (jɔɔng) «бронировать», ว่าง (wâang) «свободный» и คืน (khʉʉn) «ночь».

    Завтрак по-тайски «еда утра»: อาหารเช้า.
  items: |
    จอง | бронировать | mn=Забронировать джонку: «джоонг», ровно и спокойно
    ห้อง·ว่าง | свободный номер | mn=Комната с ванной пустует: «хонг» + «ваанг» (как ванна), оба слога строго вниз
    มี·ห้อง·ว่าง·ไหม·ครับ | есть свободные номера? | mn=дословно: «мии» есть + «хонг ваанг» свободный номер + «май?» ли, вопросом вверх
    คืน | ночь | mn=Ночью малыш хнычет протяжно: «кхыын», ровно и спокойно
    กี่·คืน | сколько ночей? | mn=дословно: «кии» сколько, низко + «кхыын» ночь (малыш хнычет): сколько ночей
    อาหาร·เช้า | завтрак | mn=«Аа-хаан» еда («А хана?») + «чаао» утро (чао!): утренняя еда, «чаао» высоко
    เช็ค·อิน | заселение | mn=Звучит как «чек-ин» в отеле: «чек» высоко + «ин» ровно
    รหัส·ไวไฟ | пароль от вайфая | mn=Пароль «рахат-лукум»: «ра-хат» (высоко, низко) + привычный «вай-фай»
  dialog: |
    me: สวัสดี·ครับ ผม·จอง·ห้อง·ไว้·ครับ | Здравствуйте, я бронировал номер | fru=Здравствуйте, я бронировала номер
    t: ชื่อ·อะไร·คะ | На какое имя?
    me: ลีโอ·ครับ | Лео | tr=lii-oo khráp | ftr=an-naa khâ
    t: สาม·คืน·นะ·คะ | На три ночи, верно?
    me: ใช่·ครับ รหัส·ไวไฟ·อะไร·ครับ | Да. Какой пароль от вайфая?

- id: s4_06
  title: "Поездки: транспорт"
  intro: |
    Билет это ตั๋ว (tǔa). На вокзале и в аэропорту главный вопрос: во сколько отправляется, ออกกี่โมง.

    Считая билеты, говорят счётное слово ใบ (bai): ตั๋วหนึ่งใบ, «один билет».
  items: |
    ตั๋ว | билет | mn=Билет на «Ту-154»: «туа», вопросом снизу вверх
    รถ·เมล์ | городской автобус | mn=«Рот» транспорт, высоко + «мээ» как мэрия: городской транспорт, ровно
    รถไฟ | поезд | mn=«Рот» транспорт (высоко) + «фай» огонь, как файер: паровоз пышет огнём
    เรือ | лодка, паром | mn=Лодка идёт за рыбой: «рыа» почти «рыба», ровно и спокойно
    สนามบิน | аэропорт | mn=Мистер Бин улетает из аэропорта: «са-наам-бин», «наам» вопросом вверх
    สถานี | станция | mn=«Са-тхаа-нии» почти «станция»: «тхаа» вопросом вверх, «нии» ровно
    ออก·กี่·โมง·ครับ | во сколько отправляется? | mn=дословно: «оок» выходить (как «ок, поехали», низко) + «кии-моонг» сколько часов
    ถึง·กี่·โมง·ครับ | во сколько прибывает? | mn=дословно: «тхынг» прибыть (как «тык!», снизу вверх) + «кии-моонг» сколько часов
    ขอ·ตั๋ว·ไป·เชียงใหม่·หนึ่ง·ใบ·ครับ | один билет до Чиангмая, пожалуйста | mn=«Кхоо» дайте + «туа» билет + «пай» до + «чианг-май» + «нынг бай» один
  dialog: |
    me: ขอ·ตั๋ว·ไป·เชียงใหม่·หนึ่ง·ใบ·ครับ | Один билет до Чиангмая, пожалуйста
    t: รอบ·กี่·โมง·คะ | На какое время?
    me: รอบ·เช้า·ครับ | На утренний
    t: แปด·ร้อย·บาท·ค่ะ | 800 бат

- id: s4_07
  title: "Поездки: массаж"
  intro: |
    Тайский массаж бывает мягким и очень сильным, и мастер обязательно спросит про ощущения. Отвечай: เบาๆ «полегче», แรงๆ «посильнее», กำลังดี «в самый раз».

    Больно по-тайски เจ็บ (jèp). Не стесняйся его говорить, мастера привыкли.
  items: |
    นวด | массаж; массировать | mn=Спина ноет («нуат»), и ладонь ведёт строго сверху вниз: массаж
    นวด·ไทย | тайский массаж | mn=«Нуат» (ноет) строго вниз + «тхай» как «тай-» в Таиланде: тайский массаж
    นวด·เท้า | массаж ног | mn=Ноги тают от массажа: «нуат» массаж, строго вниз + «тхаао» ноги, высоко
    นวด·น้ำมัน | массаж с маслом | mn=Спину массируют («нуат») и мажут маслом: «нам-ман» как «намажь», «нам» высоко
    ชั่วโมง | час | mn=«Чуа» как «час» (строго вниз) + «моонг» как гонг (ровно): каждый час бьёт гонг
    เบา·ๆ | полегче | mn=Нежно, как мягкую булочку бао: «бао-бао», ровно и спокойно
    แรง·ๆ | посильнее | mn=Боксёры на ринге бьют сильнее: «рээнг-рээнг», ровно, но с нажимом
    กำลัง·ดี | в самый раз | mn=дословно «сила хорошая»: «кам-ланг» сила + «дии» хорошо, нажим в самый раз
    เจ็บ | больно | mn=Джип наехал на ногу: «джэп», больно, коротко и низко
  dialog: |
    t: นวด·อะไร·ดี·คะ | Какой массаж хотите?
    me: นวด·ไทย·ครับ | Тайский
    t: กี่·ชั่วโมง·คะ | На сколько часов?
    me: หนึ่ง·ชั่วโมง·ครับ | На час
    t: เจ็บ·ไหม·คะ | Не больно?
    me: เบา·ๆ·หน่อย·ครับ | Полегче, пожалуйста
  mission: На массаже попроси полегче или посильнее по-тайски | เบา·ๆ·หน่อย·ครับ

- id: s4_08
  title: "Поездки: море и острова"
  split: 4
  intro: |
    ทะเล (thá-lee) море, เกาะ (kɔ̀) остров, หาด (hàat) пляж. Названия островов начинаются с เกาะ: เกาะสมุย (kɔ̀ sà-mǔi) это остров Самуи.

    Солнце в Таиланде злое, пригодятся ร่ม (rôm) «зонт, тень» и крем от солнца.
  items: |
    ทะเล | море | mn=Талый снег стекает в море: «тха-лее», «тха» высоко, «лее» ровно
    เกาะ | остров | mn=«Ко» как в «Ко Самуи»: остров, вполголоса, низко
    หาด | пляж | mn=Хата прямо на пляже: «хаат» почти «хата», низко и устало
    ว่าย·น้ำ | плавать | mn=Прыгаешь с криком «ваай!» (строго вниз) в воду «наам» (высоко): плывёшь
    ร่ม | зонт; тень | mn=В бокале с ромом торчит зонтик: «ром», строго, сверху вниз
    แดด | солнце, солнечный свет | mn=Дед греется на солнце: «дээт» почти «дед», устало и низко
    ครีม·กัน·แดด | солнцезащитный крем | mn=«Кхриим» крем + «кан» против + «дээт» солнце (дед): крем против солнца
    ไป·เกาะ·ยัง·ไง·ครับ | как добраться до острова? | mn=дословно: «пай» ехать + «ко» остров + «янг-нгай» как: ехать на остров как?
    สวย·จัง | как красиво! | mn=«Суай» вопросом вверх + «джанг» как «ух ты!»: любуешься, как красиво

- id: s4_09
  title: "Общение: о себе"
  intro: |
    Первый вопрос тайца иностранцу почти всегда: มาจากไหน, «откуда ты?». Дальше спросят, давно ли ты в Таиланде и нравится ли.

    Россия по-тайски รัสเซีย (rát-sia). И приготовься: за пару слов по-тайски тебе скажут พูดไทยเก่ง, «хорошо говоришь по-тайски». Это вежливость, но приятно.
  items: |
    มา·จาก·ไหน·ครับ | откуда вы? | mn=«Маа» прийти + «джаак» из (Жак из Парижа) + «най?» где, вопросом вверх
    ผม·มา·จาก·รัสเซีย·ครับ | я из России | mn=дословно: «маа-джаак» прийти из (Жак из Парижа) + «рат-сиа» почти «Россия»
    อยู่·เมือง·ไทย·นาน·ไหม·ครับ | давно в Таиланде? | mn=«Юу» находиться + «мыанг-тхай» Таиланд + «наан» долго, тянешь + «май?» ли
    ยัง·ไม่·นาน·ครับ | ещё недавно | mn=дословно «ещё не долго»: «янг» ещё + «май» не, строго вниз + «наан» долго
    ชอบ·เมือง·ไทย·ไหม·ครับ | вам нравится Таиланд? | mn=«Чооп» нравится (шопинг) + «мыанг-тхай» Таиланд + «май?» ли, вопросом вверх
    ชอบ·มาก·ครับ | очень нравится | mn=Шопинг очень нравится: «чооп» + «маак», оба слога строго, сверху вниз
    ผม·กำลัง·เรียน·ภาษา·ไทย | я учу тайский | mn=дословно: «кам-ланг» сейчас + «риан» (рьяно) учиться + «пхаа-саа тхай» тайский язык
  dialog: |

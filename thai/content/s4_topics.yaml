    me: ทำ·โปรแกรม·ครับ | Делаю программы

- id: s4_11
  title: "Общение: разговор ни о чём"
  split: 6
  intro: |
    Тайский small talk это погода, еда и «куда идёшь». ไปไหน «куда?» и กินข้าวหรือยัง «поел?» это приветствия, а не допрос. Отвечай коротко: ไปเที่ยว «гуляю» или กินแล้ว «уже поел».

    Погода: ร้อน жарко, ฝนตก идёт дождь, อากาศดี хорошая погода.
  fem: |
    «поел?» => «поела?»
    «уже поел» => «уже поела»
  items: |
    ไป·ไหน·ครับ | куда идёте? | mn=«Пай» идти (как в школу) + «най?» куда, вопросом снизу вверх
    ไป·เที่ยว | гуляю, еду отдыхать | mn=Пай-мальчик пошёл гулять: «пай-тхиао», «пай» ровно, «тхиао» строго вниз
    อากาศ | погода; воздух | mn=«Аа-каат» как «ах, как!»: ахаешь от воздуха и погоды, «каат» низко
    อากาศ·ดี | хорошая погода | mn=«Ах, как!» («аа-каат») + «дии» хорошо (ровно): ах, как хорошо на улице
    ฝน·ตก | идёт дождь | mn=«Фон» как фонтан с неба + «ток» стучат капли: дождь, «ток» низко
    วันนี้·ร้อน·มาก | сегодня очень жарко | mn=дословно: «ван-нии» сегодня + «роон» жарко, высоко + «маак» очень, строго вниз
    สนุก | весело | mn=С горки на санках: «са-нук», весело, оба слога низко, вполголоса
    เหมือน·กัน | взаимно; тоже | mn=дословно «одинаково друг с другом», то есть тоже: «мыан» снизу вверх, «кан» ровно
    แล้ว·เจอ·กัน | увидимся | mn=дословно: «лээо» потом, высоко + «джёё» встретить + «кан» друг друга: увидимся

- id: s4_12
  title: "Общение: чувства и комплименты"
  intro: |
    Тайцы ценят мягкость, и комплимент с улыбкой решает больше, чем кажется. เก่ง (kèng) «молодец, умелый», น่ารัก «милый», ใจดี «добрый», дословно «хорошее сердце».

    Из ใจ (jai) «сердце» тайцы делают десятки слов о чувствах: ดีใจ «рад», เสียใจ «сожалею», ใจเย็น «спокойный», дословно «холодное сердце». Последнее для тайцев главная добродетель.
  items: |
    เก่ง | молодец, умелый | mn=Кенгуру прыгнул выше всех, молодец: «кенг», вполголоса, низко
    น่ารัก | милый | mn=дословно: «наа» достоин (строго вниз) + «рак» любить (высоко): достоин любви
    ใจดี | добрый | mn=Ди-джей наоборот: «джай» сердце + «дии» хороший: доброе сердце, оба ровно
    ดีใจ | рад | mn=«Дии-джай» как «ди-джей»: хорошо на сердце, ровно и спокойно
    เสียใจ | сожалею; грустно | mn=Сердце сломалось: «сиа» (снизу вверх) + «джай» сердце: грустно
    ใจเย็น·ๆ | спокойно, не горячись | mn=Сердцу велишь остыть: «джай-йен», холодное сердце, ровно и спокойно | tr=jai-yen-yen | say=ใจเย็นเย็น
    ไม่·ต้อง·ห่วง | не волнуйтесь | mn=«Май тонг» не нужно, оба строго вниз + «хуанг» волноваться, низко
    สบาย·ๆ | расслабься, всё легко | mn=«Са-баай, са-баай» как колыбельная «баю-бай»: расслабься, всё легко
    ขอบคุณ·มาก·ครับ | большое спасибо | mn=«Кхооп-кхун» спасибо + «маак» очень (красный мак), строго вниз
  mission: Скажи кому-нибудь, что он молодец | เก่ง·มาก·ครับ

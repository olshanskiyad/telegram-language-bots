- id: s4_10
  title: "Общение: работа"
  intro: |
    ทำงาน (tham-ngaan) «работать», дословно «делать работу». Вопрос ทำงานอะไร значит «кем работаешь?».

    Про своё дело: ธุรกิจของตัวเอง, «собственный бизнес».
  items: |
    ทำงาน | работать | mn=Там, в ангаре, работают: «тхам-нгаан», оба слога ровно
    ทำงาน·อะไร·ครับ | кем вы работаете? | mn=дословно: «тхам-нгаан» работать (там, в ангаре) + «а-рай» что
    ธุรกิจ | бизнес | mn=Тур, Рак и Кит открыли бизнес: «тху-ра-кит», последний слог низко
    บริษัท | компания | mn=Компания Бориса: «боо-ри-сат» почти «Борис», «сат» низко
    ผม·มี·ธุรกิจ·ของ·ตัวเอง | у меня свой бизнес | mn=дословно: «мии» есть + «тху-ра-кит» бизнес + «кхоонг туа-ээнг» свой собственный
    ลูกค้า | клиент | mn=Дитя торговли: «луук» (ребёнок, строго вниз) + «кхаа» (зазывает торговец, высоко)
    ยุ่ง | занят | mn=Юнга драит палубу, он занят: «юнг», строго, сверху вниз
    วันนี้·ยุ่ง·มาก | сегодня очень занят | fru=сегодня очень занята | mn=дословно: «ван-нии» сегодня + «юнг» некогда (как юнге) + «маак» очень
    ออนไลน์ | онлайн | mn=Почти как «онлайн»: «оон-лаай», ровно и спокойно
  dialog: |
    t: ทำงาน·อะไร·คะ | Кем вы работаете?
    me: ผม·มี·ธุรกิจ·ของ·ตัวเอง·ครับ | У меня свой бизнес

# Разговорные сценки: фразы для живого общения. Учатся за 5 минут и уходят в повторение,
# в меню «💬 Разговор» вместе с местами из places.yaml.
# phrases: по порядку, как звучат в разговоре. Строка без метки говоришь ты (мужская речь, женский
# вариант строится сам), «t: » говорят тебе: женский голос с ค่ะ/คะ, с voice=m мужской с ครับ.
# dialog: сценка по ролям в конце, как в уроках.
- id: hello
  title: 👋 Куда идёшь? Как дела?
  intro: |
    Каждый день тайцы здороваются вопросом «куда идёшь?». Это вежливость, как наше «привет», подробно отвечать не нужно: хватит «гуляю». А «как дела?» спрашивают, когда давно не виделись, и отвечают «хорошо».

    В разговоре «вы» часто опускают: вместо คุณจะไปไหน говорят просто จะไปไหน.
  phrases: |
    สบาย·ดี·ไหม·ครับ | как дела? | дословно «хорошо ли?»; так спрашивают, когда давно не виделись
    สบาย·ดี·ครับ | хорошо, всё в порядке
    แล้ว·คุณ·ล่ะ·ครับ | а у вас? | fth=แล้ว·คุณ·ล่ะ·คะ
    จะ·ไป·ไหน·ครับ | куда идёте?
    ไป·เที่ยว·ครับ | гулять, отдыхать
    t: ไป·ตลาด·ค่ะ | на рынок
    t: กลับ·บ้าน·ค่ะ | домой
    ไป·ก่อน·นะ·ครับ | ну, я пойду | так прощаются, когда уходят
  dialog: |
    t: สวัสดี·ค่ะ สบาย·ดี·ไหม·คะ | Здравствуйте! Как дела?
    me: สบาย·ดี·ครับ แล้ว·คุณ·ล่ะ·ครับ | Хорошо. А у вас? | fth=สบาย·ดี·ค่ะ แล้ว·คุณ·ล่ะ·คะ
    t: สบาย·ดี·ค่ะ จะ·ไป·ไหน·คะ | Хорошо. Куда идёте?
    me: ไป·เที่ยว·ครับ | Гулять
    t: เที่ยว·ให้·สนุก·นะ·คะ | Хорошо погулять!
    me: ขอบคุณ·ครับ ไป·ก่อน·นะ·ครับ | Спасибо! Ну, я пойду
  mission: Спроси соседа или знакомого, куда он идёт | จะ·ไป·ไหน·ครับ

- id: eat
  title: 🍚 Поели? Где были?
  intro: |
    Ещё два тайских «привета». На «поели?» отвечают «уже» или «ещё нет»: это забота, а не приглашение к столу. На «где были?» называют место.

    มา (maa) в конце фразы значит «туда и обратно»: ไปทะเลมา «съездил на море и вернулся».
  fem: |
    «съездил на море и вернулся» => «съездила на море и вернулась»
  phrases: |
    กิน·ข้าว·ยัง·ครับ | поели?
    กิน·แล้ว·ครับ | уже поел | fru=уже поела
    ยัง·ครับ | ещё нет
    t: คุณ·กิน·อาหาร·เช้า·ยัง | завтракали? | อาหารเช้า «завтрак», дословно «еда утра»
    ไป·เที่ยว·ไหน·มา·ครับ | где были? куда ездили?
    ไป·เที่ยว·หาด·กะตะ·มา·ครับ | ездил на пляж Ката | fru=ездила на пляж Ката | tr=pai-thîao hàat kà-tà maa khráp | ftr=pai-thîao hàat kà-tà maa khâ
    t: ไป·ธุระ·มา·ค่ะ | ходила по делам | вежливый ответ, когда не хотят рассказывать
  dialog: |
    t: กิน·ข้าว·ยัง·คะ | Поели?
    me: กิน·แล้ว·ครับ | Уже поел | fru=Уже поела
    t: ไป·เที่ยว·ไหน·มา·คะ | Где были?
    me: ไป·เที่ยว·หาด·กะตะ·มา·ครับ | Ездил на пляж Ката | fru=Ездила на пляж Ката | tr=pai-thîao hàat kà-tà maa khráp | ftr=pai-thîao hàat kà-tà maa khâ
  mission: Спроси знакомого тайца, поел ли он | กิน·ข้าว·ยัง·ครับ

- id: again
  title: 🙏 Когда непонятно
  intro: |
    Не понимать тайца нормально, главное не молчать. Скажи, что не понимаешь, попроси помедленнее или ещё раз, и тебе скажут проще или покажут рукой.

    Последняя фраза учит языку прямо на улице: покажи на предмет и спроси, как он называется.
  phrases: |
    ไม่·เข้าใจ·ครับ | не понимаю
    อะไร·นะ·ครับ | что, простите? | самый частый способ переспросить
    ช่วย·พูด·ช้า·ๆ·หน่อย·ครับ | говорите помедленнее, пожалуйста
    พูด·อีก·ที·ได้·ไหม·ครับ | можете повторить?
    เข้าใจ·แล้ว·ครับ | теперь понятно
    t: พูด·ไทย·ได้·ไหม·คะ | говорите по-тайски?
    ได้·นิดหน่อย·ครับ | немного
    อัน·นี้·ภาษา·ไทย·เรียก·ว่า·อะไร·ครับ | как это по-тайски?
  dialog: |
    t: พรุ่งนี้·ผม·จะ·มา·ตัด·หญ้า·นะ·ครับ | Завтра приду стричь траву | voice=m
    me: ไม่·เข้าใจ·ครับ ช่วย·พูด·ช้า·ๆ·หน่อย·ครับ | Не понимаю. Помедленнее, пожалуйста
    t: พรุ่งนี้ ตัด·หญ้า | Завтра. Стричь траву | voice=m
    me: เข้าใจ·แล้ว·ครับ ขอบคุณ·ครับ | Понятно, спасибо
  mission: Покажи на что-нибудь и спроси, как это по-тайски | อัน·นี้·ภาษา·ไทย·เรียก·ว่า·อะไร·ครับ

- id: garden
  title: 🏡 Сосед и садовник
  intro: |
    Пара слов человеку, который работает рядом: про жару, про его дело, похвала и спасибо. Тайцы ценят такие мелочи больше длинных разговоров.
  phrases: |
    วัน·นี้·ร้อน·มาก·นะ·ครับ | сегодня жарко, да?
    ทำ·อะไร·อยู่·ครับ | что делаете?
    t: รด·น้ำ·ต้นไม้·ครับ | поливаю растения | voice=m
    สวย·มาก·ครับ | очень красиво
    t: ฝน·จะ·ตก·นะ·ครับ | скоро дождь | voice=m
    t: เสร็จ·แล้ว·ครับ | готово, закончил | voice=m
    t: พรุ่งนี้·มา·ใหม่·นะ·ครับ | завтра приду снова | voice=m
  dialog: |
    t: สวัสดี·ครับ | Здравствуйте | voice=m
    me: สวัสดี·ครับ วัน·นี้·ร้อน·มาก·นะ·ครับ | Здравствуйте! Сегодня жарко, да?
    t: ร้อน·มาก·ครับ | Очень жарко | voice=m
    me: ทำ·อะไร·อยู่·ครับ | Что делаете?
    t: รด·น้ำ·ต้นไม้·ครับ | Поливаю растения | voice=m
    me: สวย·มาก·ครับ ขอบคุณ·มาก·ครับ | Очень красиво. Большое спасибо
  mission: Скажи садовнику или соседу, что сегодня жарко | วัน·นี้·ร้อน·มาก·นะ·ครับ

- id: short
  title: 👌 Короткие ответы
  intro: |
    Слова, которыми тайцы перебрасываются весь день. Ими отвечают почти на всё, даже если понятна половина.

    ได้ (dâai) это и «можно», и «хорошо, сделаю». ไม่เป็นไร это сразу «ничего страшного», «не за что» и «не надо, спасибо».
  phrases: |
    ได้·ครับ | хорошо, можно
    ใช่·ครับ | да, верно
    ไม่·ใช่·ครับ | нет, не так
    ไม่·ต้อง·ครับ | не нужно
    เดี๋ยว·ก่อน·ครับ | минутку, подождите
    จริง·เหรอ·ครับ | серьёзно? правда?
    ไม่·เป็นไร·ครับ | ничего страшного; не за что
  dialog: |
    t: รอ·สักครู่·นะ·คะ | Подождите минутку
    me: ได้·ครับ | Хорошо
    t: ขอโทษ·ที่·ให้·รอ·นาน·นะ·คะ | Простите, что заставила долго ждать
    me: ไม่·เป็นไร·ครับ | Ничего страшного
    t: รับ·ถุง·ไหม·คะ | Пакет нужен?
    me: ไม่·ต้อง·ครับ | Не нужно
  mission: Когда тайцу неловко, скажи ему ไม่เป็นไร | ไม่·เป็นไร·ครับ

- id: about
  title: 🙋 Откуда вы? Нравится?
  intro: |
    Иностранцу задают одни и те же вопросы: откуда, в отпуске ли, нравится ли Таиланд. Выучи ответы один раз, и разговор продлится пару минут.

    За пару слов по-тайски тебя обязательно похвалят: พูดไทยเก่งจัง, «как хорошо говорите». Отвечай скромно: «немного».
  phrases: |
    t: มา·จาก·ไหน·คะ | откуда вы?
    ผม·มา·จาก·รัสเซีย·ครับ | я из России
    t: ชอบ·เมืองไทย·ไหม·คะ | нравится Таиланд?
    ชอบ·มาก·ครับ | очень нравится
    t: มา·เที่ยว·เหรอ·คะ | отдыхать приехали?
    ผม·อยู่·แถว·นี้·ครับ | я живу тут рядом
    t: พูด·ไทย·เก่ง·จัง | как хорошо говорите по-тайски!
    นิดหน่อย·ครับ กำลัง·เรียน·อยู่ | немного, пока учусь
  dialog: |
    t: มา·จาก·ไหน·คะ | Откуда вы?
    me: ผม·มา·จาก·รัสเซีย·ครับ | Я из России
    t: พูด·ไทย·เก่ง·จัง | Как хорошо говорите по-тайски!
    me: นิดหน่อย·ครับ กำลัง·เรียน·อยู่ | Немного. Пока учусь
    t: ชอบ·เมืองไทย·ไหม·คะ | Нравится Таиланд?
    me: ชอบ·มาก·ครับ | Очень нравится
  mission: Скажи тайцу, откуда ты | ผม·มา·จาก·รัสเซีย·ครับ
